<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For Rosie ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;color:#fff;background:linear-gradient(135deg,#e83d92,#a95ac9 48%,#ff7aaa);display:flex;justify-content:center;align-items:center;padding:28px 16px;overflow-x:hidden}
.card{width:min(100%,630px);padding:38px 40px 42px;border:1px solid #ffffff59;border-radius:32px;background:#ffffff21;box-shadow:0 25px 60px #46003c38;backdrop-filter:blur(8px);text-align:center}
h1{font-size:40px;margin:0 0 12px;font-weight:800}
.subtitle{font-size:20px;margin-bottom:30px}
.photo,.reveal-photo{width:100%;height:420px;object-fit:cover;object-position:center;border-radius:28px;margin-bottom:34px;box-shadow:0 14px 35px #00000047;background:#ffffff14}
.question{font-size:27px;line-height:1.25;margin:0 0 28px;font-weight:800}
.answers{display:grid;gap:16px}
.answer,.action{border:0;border-radius:22px;padding:20px 18px;background:#fff;color:#7d3a61;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 7px 15px #0000001f;transition:.18s}
.answer:hover,.action:hover{transform:translateY(-2px);box-shadow:0 10px 20px #0000002e}
.answer:active,.action:active{transform:scale(.98)}
.status{min-height:28px;margin-top:18px;font-size:17px;font-weight:700}
.progress{margin-top:28px;font-size:17px;opacity:.9}
.hidden{display:none!important}
#surprise{animation:fade .6s ease}
.surprise-title{font-size:38px;font-weight:900;margin:4px 0 18px}
.surprise-text{font-size:21px;line-height:1.5;margin:0 auto 28px;max-width:520px}
.big-emoji{font-size:78px;line-height:1;margin:10px 0 20px}
.reveal-photo{height:420px;margin:10px 0 24px}
.action{padding:18px 25px;font-size:19px;font-weight:900}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.heart{position:fixed;bottom:-30px;font-size:24px;pointer-events:none;animation:float 5s linear forwards;z-index:5}
@keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.confetti{position:fixed;width:9px;height:15px;top:-20px;pointer-events:none;z-index:6;animation:fall 3.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(max-width:520px){body{padding:18px 10px}.card{padding:34px 28px 38px;border-radius:28px}h1{font-size:35px}.subtitle{font-size:18px;margin-bottom:26px}.photo,.reveal-photo{height:420px;border-radius:24px}.question{font-size:23px}.answer{font-size:18px;padding:18px 14px}.surprise-title{font-size:32px}}
</style>
</head>
<body>
<main class="card">
<section id="quiz">
<h1>For Rosie ❤️</h1>
<div class="subtitle">Let's see how well you know us 😊</div>
<img id="photo" class="photo" alt="Rosie ❤️">
<h2 id="question" class="question"></h2>
<div id="answers" class="answers"></div>
<div id="status" class="status"></div>
<div id="progress" class="progress"></div>
</section>
<section id="surprise" class="hidden"></section>
</main>

const questions=[{"q": "Who is the cutest person in the world? 😌", "a": ["Rosie ❤️", "Obviously me 😎", "My neighbor 😅"], "correct": 0}, {"q": "Who is most likely to say 'I'm fine' when they're definitely not? 😂", "a": ["Me 😭", "Rosie ❤️", "Both of us 💀"], "correct": 0}, {"q": "Who would survive longer without texting the other first? 📱", "a": ["Rosie 😏", "Me 😎", "Neither of us 😂"], "correct": 1}, {"q": "Who deserves the biggest hug? 🫂", "a": ["Me 😌", "Rosie ❤️", "Both of us 🥹"], "correct": 2}, {"q": "Who is the funniest person here? 😎", "a": ["Rosie 😂", "Me obviously 😌", "We're both disasters 💀"], "correct": 1}, {"q": "And finally... who is the favorite? 👀", "a": ["Rosie ❤️", "Me 😎", "It's obviously both of us 🥰"], "correct": 2}];
let current=0;
const qEl=document.getElementById("question");
const aEl=document.getElementById("answers");
const sEl=document.getElementById("status");
const pEl=document.getElementById("progress");

function renderQuestion(){
 const x=questions[current];
 qEl.textContent=x.q;
 aEl.innerHTML="";
 sEl.textContent="";
 pEl.textContent=`Question ${current+1} of ${questions.length}`;
 x.a.forEach((t,i)=>{
  const b=document.createElement("button");
  b.className="answer";
  b.textContent=t;
  b.onclick=()=>choose(i);
  aEl.appendChild(b);
 });
}

function choose(i){
 const x=questions[current];
 if(i!==x.correct){
  sEl.textContent="Wrong 😏 Try again!";
  return;
 }
 sEl.textContent="Correct! 😌❤️";
 [...aEl.children].forEach(b=>b.disabled=true);
 setTimeout(()=>{
  current++;
  current<questions.length?renderQuestion():showSurprise();
 },600);
}

function showSurprise(){
 document.getElementById("quiz").classList.add("hidden");
 const b=document.getElementById("surprise");
 b.classList.remove("hidden");
 b.innerHTML=`<div class="big-emoji">🎁</div>
 <div class="surprise-title">You passed! 😏</div>
 <p class="surprise-text">There's something inside... 💕</p>
 <button class="action" onclick="reveal(1)">OPEN YOUR SURPRISE 🎁</button>`;
 confettiBurst();
}

function reveal(step){
 const b=document.getElementById("surprise");
 if(step===1)b.innerHTML=`<div class="surprise-title">WAIT... 😳</div>
 <p class="surprise-text">You actually passed the whole quiz?!<br><br>I honestly wasn't expecting that.</p>
 <button class="action" onclick="reveal(2)">KEEP GOING 👀</button>`;
 else if(step===2)b.innerHTML=`<div class="surprise-title">WE HAVE A PROBLEM. 💀</div>
 <p class="surprise-text">Rosie... You were never supposed to get this far. 💀<br><br>
 The quiz was supposed to expose you.<br><br>
 Instead... <b>YOU EXPOSED YOURSELF. 😭</b></p>
 <button class="action" onclick="reveal(3)">OH NO... CONTINUE 😭</button>`;
 else if(step===3)b.innerHTML=`<div class="surprise-title">HERE'S THE VERDICT... ⚖️</div>
 <p class="surprise-text">After a very serious investigation... 🧐<br><br>
 <b>ROSIE HAS BEEN DECLARED TOO CUTE TO BE LEFT UNSUPERVISED. 😭❤️</b></p>
 <button class="action" onclick="reveal(4)">SEE YOUR PUNISHMENT 😈</button>`;
 else {
  b.innerHTML=`<div class="surprise-title">TOO LATE. 😌</div>
  <img src="${rosiePhoto}" class="reveal-photo" alt="Rosie ❤️">
  <p class="surprise-text">The decision is final.<br>
  There is no appeal.<br>
  There is no escape.<br>
  There is definitely no refund. 💀<br><br>
  Your punishment is... <b>ONE VERY LONG HUG. 🫂</b><br>
  And maybe... a little kiss if you're lucky. 😏</p>
  <button class="action" onclick="restart()">RUN THE INVESTIGATION AGAIN 🔄</button>`;
  confettiBurst();startHearts();
 }
 b.animate([{opacity:0,transform:"translateY(15px)"},{opacity:1,transform:"translateY(0)"}],{duration:500,fill:"forwards"});
}

function restart(){
 current=0;
 document.getElementById("surprise").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 renderQuestion();
 window.scrollTo({top:0,behavior:"smooth"});
}

function startHearts(){
 for(let i=0;i<18;i++)setTimeout(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["❤️","💕","💗","💖","💘"][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=4+Math.random()*3+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7500);
 },i*180);
}

function confettiBurst(){
 for(let i=0;i<55;i++)setTimeout(()=>{
  const c=document.createElement("div");
  c.className="confetti";
  c.style.left=Math.random()*100+"vw";
  c.style.animationDuration=2.2+Math.random()*1.8+"s";
  c.style.background=`hsl(${Math.random()*360},80%,60%)`;
  c.style.transform=`rotate(${Math.random()*360}deg)`;
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),4500);
 },i*25);
}

renderQuestion();
</script>
</body>
</html>
